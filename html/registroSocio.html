<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
        <title>Registro Socio</title>
    </head>
    <body>
        <!-- Barra de navegación -->
        <header class="menu">
            <div class="navbar">
                <div class="logo"><a href="./inicio.html">EcoAventura</a></div>
                <div class="menu-toggle">&#9776;</div> <!-- Ícono de menú hamburguesa -->
                <ul class="nav-links">
                    <li><a href="./inicio.html">Inicio</a></li>
                    <li><a href="#">PLANIFICA TU VIAJE</a></li>
                    <li><a href="../Pagina_socios/index.html">RESERVA</a></li>
                    <li><a href="#">CONTACTO</a></li>
                    <li><a href="../Inicio y Registro/index.html">PERFIL</a></li>
                </ul>
            </div>
        </header>

        <!-- Sección del formulario de registro -->
        <div class="container">
            <h2>Registro de Socio</h2>
            <form> <!-- El formulario enviará datos con el método POST -->
                <!-- Sección de datos de contacto -->
                <label for="nombre-contacto">Nombre de Contacto:</label>
                <input type="text" id="nombre-contacto" name="nombre-contacto" required>
                
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" required>
                
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required>
                
                <!-- Campo para ingresar el nombre de la empresa -->
                <label for="nombre-empresa">Nombre de la Empresa:</label>
                <input type="text" id="nombre-empresa" name="nombre-empresa" required>

                <!-- Campo para seleccionar el tipo de servicio -->
                <label for="tipo-servicio">Tipo de Servicio:</label> <!-- Asocia el label con el select -->
                <input type="text" id="tipo-servicio" placeholder="Tipo de Servicio" required>
                
                <!-- Campo para ingresar la ubicación del negocio -->
                <label for="ubicacion">Ubicación:</label>
                <input type="text" id="ubicacion" name="ubicacion" required>
                
                <!-- Campo para describir el servicio ofrecido -->
                <label for="descripcion">Descripción del Servicio:</label>
                <textarea id="descripcion" name="descripcion" rows="4" required></textarea> <!-- rows indica la altura del textarea -->
                
                <!-- Campo para subir imágenes del lugar -->
                <label for="imagenes">Imágenes del Lugar:</label>
                <input type="file" id="imagenes" name="imagenes" multiple accept="image/*"> <!-- Permite subir varias imágenes -->
                
                <!-- Botón para enviar el formulario -->
                <button type="submit">📝 Registrar</button>
            </form>
        </div>
        <!-- PIE DE PÁGINA -->
        <footer>
            <div class="footer-section">
                <h3>Redes Sociales</h3>
                <div class="footer-icons">
                    <a href="https://www.facebook.com" target="_blank"><i class='bx bxl-facebook'></i></a>
                    <a href="https://twitter.com" target="_blank"><i class='bx bxl-twitter'></i></a>
                    <a href="https://www.instagram.com" target="_blank"><i class='bx bxl-instagram'></i></a>
                </div>
            </div>

            <div class="footer-section">
                <h3>Contacto</h3>
                <p>Email: <a href="mailto:contacto@ecoaventura.com">contacto@ecoaventura.com</a></p>
                <p>Teléfono: <a href="tel:+573001234567">+57 300 123 4567</a></p>
            </div>

            <div class="footer-section">
                <h3>Información</h3>
                <ul class="footer-links">
                    <li><a href="./inicio.html">Inicio</a></li>
                    <li><a href="..//Pagina_socios/index.html">Lugares Asociados</a></li>
                    <li><a href="#">Sobre Nosotros</a></li>
                    <li><a href="..//registroSocio/registroSocio.html">Hazte Parte de Ecoaventura Risaralda</a></li>
                </ul>
            </div>
        </footer>
        <script src="../js/registroSocio.js"></script>
    </body>
</html>
